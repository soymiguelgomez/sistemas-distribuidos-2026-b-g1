# Security gates proposed for the Futbolix Java services (reservation-service, payment-service).
# It lives in the course fork; in a service repository SERVICE_DIR would be ".".
name: security-gates

on:
  pull_request:
    branches: [develop, qa, main]

permissions:
  contents: read

env:
  SERVICE_DIR: 13-week/workshop/04-security-ci/broker-authz-test

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan the commits of this pull request
        run: >
          docker run --rm -v "${{ github.workspace }}:/repo" zricethezav/gitleaks:v8.21.2
          git /repo --redact --verbose --exit-code 1
          --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

  dependency-audit:
    name: Dependency audit (OWASP dependency-check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Fail on any dependency with CVSS >= 7
        working-directory: ${{ env.SERVICE_DIR }}
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: mvn -B org.owasp:dependency-check-maven:12.1.0:check -DfailBuildOnCVSS=7 -DnvdApiKey="$NVD_API_KEY"

  authorization-tests:
    name: Negative authorization tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Broker permissions (Testcontainers RabbitMQ)
        working-directory: ${{ env.SERVICE_DIR }}
        run: mvn -B test -Dtest='*NegativeTest'
